# Explicitly local-only published ports. Do not use as a production override.
services:
  postgres-app:
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT:-5432}:5432"
  temporal:
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
  temporal-ui:
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"
