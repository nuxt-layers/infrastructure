# Isolated local ACME; no public CA or host port other than loopback probes.
services:
  pebble:
    image: ${PEBBLE_IMAGE:?Digest-qualified Pebble required}
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    networks: [fixture, probe]
    ports: ["127.0.0.1::15000"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: &bounded
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  proxy:
    image: ${TRAEFIK_IMAGE:?Digest-qualified Traefik required}
    command:
      - --log.level=INFO
      - --entrypoints.web.address=:5002
      - --entrypoints.websecure.address=:8443
      - --providers.file.filename=/fixture/routes.yaml
      - --certificatesresolvers.local.acme.caserver=https://pebble:14000/dir
      - --certificatesresolvers.local.acme.caservername=localhost
      - --certificatesresolvers.local.acme.cacertificates=/fixture/pebble.minica.pem
      - --certificatesresolvers.local.acme.storage=/state/acme.json
      - --certificatesresolvers.local.acme.httpchallenge.entrypoint=web
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api=false
    volumes:
      - "${ACME_FIXTURE_DIR:?Required}:/fixture:ro"
      - state:/state
    networks:
      fixture:
        aliases: [site-a.fixture.test, site-b.fixture.test]
      probe: {}
    ports: ["127.0.0.1::8443"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *bounded
  site:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    networks: [fixture]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded
networks:
  fixture:
    internal: true
  probe:
    driver: bridge
volumes:
  state: {}
