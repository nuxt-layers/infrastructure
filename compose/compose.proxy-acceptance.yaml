# Disposable Traefik fixture; no Docker socket, public bind, or ACME account.
services:
  proxy:
    image: ${TRAEFIK_FIXTURE_IMAGE:?Reviewed digest-qualified Traefik image required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /seed/routes.yaml /dynamic/routes.yaml
        exec traefik --entrypoints.websecure.address=:8443 --entrypoints.websecure.forwardedheaders.insecure=false --entrypoints.websecure.http.aliasheadersstrategy=delete --providers.file.directory=/dynamic --providers.file.watch=true --log.level=INFO --api=false --global.checknewversion=false --global.sendanonymoususage=false
    tmpfs:
      - /dynamic:size=1m,mode=0700
    volumes:
      - "${PROXY_FIXTURE_DIR:?Required}/dynamic:/seed:ro"
      - "${PROXY_FIXTURE_DIR:?Required}/certificates:/certificates:ro"
    ports: ["127.0.0.1::8443"]
    networks: [fixture]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: &bounded
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  site-a:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - "${PROXY_FIXTURE_DIR:?Required}/site-a.conf:/etc/nginx/conf.d/default.conf:ro"
    networks: [fixture]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded
  site-b:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - "${PROXY_FIXTURE_DIR:?Required}/site-b.conf:/etc/nginx/conf.d/default.conf:ro"
    networks: [fixture]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded
networks:
  fixture:
    driver: bridge
